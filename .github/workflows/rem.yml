# MapKoon REM schedule: rebuilt every day (and when started by hand from the Actions tab)
name: Build REM schedule
on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transit-save
  cancel-in-progress: false
jobs:
  rem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build from the REM's schedule file
        run: python rem_schedule.py
      - name: Save the result
        run: |
          git config user.name "MapKoon bot"
          git config user.email "bot@mapkoon.com"
          git add -A rem
          git diff --cached --quiet || git commit -m "REM schedule $(date -u +%Y-%m-%d)"
          git pull -q --rebase || true
          git push
